services:
  redis:
    image: redis:latest
    container_name: my-redis-server
    ports:
      - 6380:6379
    volumes:
      - redis_data:/data
  db:
    build:
      context: ..
      dockerfile: docker/db.dockerfile
    image: pgs.jfrog.io/pgs-docker-images/db:${BRANCH}
    env_file: db.env
    volumes:
    - db-data:/var/lib/postgresql/data
    ports:
      - 5434:5434
    command: -p 5434
volumes:
  db-data:
  redis_data: